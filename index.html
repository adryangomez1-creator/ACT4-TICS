<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f2" />
    <title>Catálogo de productos</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="catalog">
      <header class="page-header">
        <p class="eyebrow">CATÁLOGO EN LÍNEA</p>
        <h1>Productos</h1>
        <p class="intro">Explora una selección de productos disponibles.</p>
      </header>

      <section class="toolbar" aria-label="Controles del catálogo">
        <label class="search-box" for="search-input">
          <span>Buscar producto</span>
          <input
            id="search-input"
            type="search"
            placeholder="Por nombre o categoría"
            autocomplete="off"
          />
        </label>
        <button class="refresh-button" id="refresh-button" type="button">
          Actualizar
        </button>
      </section>

      <p class="status" id="status-message" role="status" aria-live="polite">
        Cargando productos...
      </p>
      <section class="product-grid" id="product-grid" aria-label="Productos"></section>
    </main>
  </body>
</html>
